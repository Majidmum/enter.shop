    <!-- Шрифт Inter: preconnect + обычная ссылка вместо @import в CSS —
         @import блокирует рендеринг страницы, пока не скачается и не
         распарсится файл шрифта. Так браузер начинает загрузку раньше
         и параллельно с остальным контентом. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
